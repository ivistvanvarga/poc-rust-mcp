[package]
name = "poc-rust-mcp"
version = "0.1.0"
edition = "2024"
# The full text is in LICENSE. Keep the SPDX identifier here and the header in LICENSE in step:
# `cargo` warns if a crate declares a license it has no `LICENSE` file for, and vice versa.
license = "BSD-3-Clause"
authors = ["iv.istvan.varga <iv.istvan.varga@gmail.com>"]

[dependencies]
rmcp = { version = "0.1", features = [
    "server",
    "transport-io",
    "transport-sse-server",
] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "mysql",
    "sqlite",
    "macros",
    "migrate",
    "json",
    "chrono",
] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
toml = "1.1.6"

[dev-dependencies]
# Only to build a `RequestContext` in unit tests: rmcp hands every handler a
# `CancellationToken`, and these tests call handlers directly instead of over a transport.
tokio-util = "0.7"
