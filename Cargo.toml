[package]
name = "poc-rust-mcp"
version = "0.1.0"
edition = "2024"
# The full text is in LICENSE. Keep the SPDX identifier here and the header in LICENSE in step:
# `cargo` warns if a crate declares a license it has no `LICENSE` file for, and vice versa.
license = "BSD-2-Clause"
authors = ["iv.istvan.varga"]

[dependencies]
rmcp = { version = "0.1", features = [
    "server",
    "transport-io",
] }
tokio = { version = "1", features = ["full"] }
http = "1"
axum = "0.8"
futures = "0.3"
tokio-stream = "0.1"
tokio-util = "0.7"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "=0.9.0", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "mysql",
    "mysql-rsa",
    "sqlite-bundled",
    "macros",
    "migrate",
    "json",
    "chrono",
] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
toml = "1.1.6"

[dev-dependencies]
# Tests call handlers directly instead of over a transport, so they build their own
# `RequestContext`; `tokio-util` itself is a normal dependency for the SSE transport.
